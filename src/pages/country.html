<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambodia</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/typography.css">
    <link rel="stylesheet" href="../styles/global.css">

    <!-- Component styles follow -->
    <link rel="stylesheet" href="../styles/components/header.css">
    <link rel="stylesheet" href="../styles/components/country-intro.css">
    <link rel="stylesheet" href="../styles/components/country-rating.css">
    <link rel="stylesheet" href="../styles/components/country-map.css">
    <link rel="stylesheet" href="../styles/components/country-navigation.css">
    <link rel="stylesheet" href="../styles/components/itinerary.css" />
    <link rel="stylesheet" href="../styles/components/best-months.css" />
    <link rel="stylesheet" href="../styles/components/budget.css" />
    <link rel="stylesheet" href="../styles/components/cuisine.css" />
    <link rel="stylesheet" href="../styles/components/faqs.css" />
    <link rel="stylesheet" href="../styles/components/inter-city-travel.css" />

    <script type="module" src="../scripts/components/country-navigation.js"></script>
    <script type="module" src="../scripts/components/country-hero.js"></script>
    <script type="module" src="../scripts/components/country-rating.js"></script>
    <script type="module" src="../scripts/components/itinerary.js"></script>
    <script type="module" src="../scripts/components/inter-city-travel.js"></script>
    <script type="module" src="../scripts/components/best-months.js"></script>
    <script type="module" src="../scripts/components/budget.js"></script>
    <script type="module" src="../scripts/components/cuisine.js"></script>
    <script type="module" src="../scripts/components/faqs.js"></script>
  </head>
  
  <body>
    
    <div class="header">

      <a
        class="logo"
        href="index.html"
        style="--map-image: url('../../assets/icons/logo.svg');"
      ></a>

      <ul class="nav">
        <li class="site-nav"><a href="/countries/destinations.html">DESTINATIONS</a></li>
        <li class="site-nav"><a href="/countries/months.html">MONTHS</a></li>
        <li class="site-nav"><a href="/countries/about.html">ABOUT</a></li>
      </ul>

    </div>

    <div class="country-page">
      <main class="country-page-content">
        <section
          class="country-hero"
          data-country-hero
          data-source="../data/countries/cambodia/country.json"
        >

        <div class="country-intro">

        <div class="country-intro-title-group">
            <h1 class="country-intro-name" data-country-name>Cambodia</h1>
        </div>

        <p class="country-intro-overview" data-country-overview>
          Cambodia is a beautiful country with a rich history and culture. From
          the ancient temples of Angkor Wat to the serene landscapes of the
          countryside, there is something for everyone to explore and enjoy.
        </p>

        <div
          class="country-rating"
          data-country-rating
          data-source="../data/countries/cambodia/country.json"
          aria-label="Country ratings"
        ></div>

        </div>


        <div
          class="country-map"
          data-country-map
          role="group"
          aria-label="Destinations in Cambodia"
          style="--map-image: url('../../assets/countries/cambodia/country-map.svg');"
        >

          <div
              class="country-map-shape"
              data-country-map-shape
              role="img"
              aria-label="Map of Cambodia"
          ></div>

          <div
            class="country-map-locations"
            data-country-map-locations
          ></div>
        </div>

        </section>

    <section class="itinerary" id="itinerary" aria-labelledby="itinerary-title">
      <h2 class="country-section-title" id="itinerary-title"></h2>
      <div class="itinerary-layout">
        <div class="itinerary-visual">
          <div
            class="polaroid-list"
            id="polaroid-list"
            role="list"
            aria-label="Itinerary days"
          ></div>
        </div>
        <article class="itinerary-editorial" id="itinerary-editorial"></article>
      </div>
    </section>

    <section class="best-months" id="best-months" aria-labelledby="best-months-title">
      <h2 class="country-section-title" id="best-months-title">Best time to visit</h2>
      <div class="best-months-layout">
        <div class="best-months-graphic">
          <figure
            class="annual-travel-dial"
            data-country="cambodia"
            data-motion="continuous"
            data-source="../data/countries/cambodia/best-months.json"
          >
            <figcaption class="visually-hidden"></figcaption>
          </figure>
        </div>

        <article
          class="best-months-editorial"
          data-best-months-editorial
        ></article>
      </div>
    </section>

    <section
      class="cuisine"
      id="cuisine"
      data-cuisine-component
      data-source="../data/countries/cambodia/cuisine.json"
      aria-labelledby="cuisine-title"
    ></section>


    <section class="budget" id="budget" aria-labelledby="budget-title">
      <h2 class="country-section-title" id="budget-title">Budget</h2>

      <div class="budget-layout">
        <div
          class="budget-receipt"
          data-budget-receipt
          data-source="../data/countries/cambodia/budget.json"
          aria-live="polite"
        ></div>

        <article
          class="budget-editorial"
          data-budget-editorial
        ></article>
      </div>
    </section>

      <section
        class="inter-city-travel"
        id="inter-city-travel"
        data-inter-city-travel
        data-source="../data/countries/cambodia/inter-city-travel.json"
        aria-label="Inter-city travel"
      ></section>

        <section
          class="faqs"
          id="faqs"
          data-faqs
          data-source="../data/countries/cambodia/faqs.json"
          aria-label="Frequently asked questions"
        ></section>
      </main>

      <aside
        class="country-navigation-rail"
        data-country-navigation-drawer
        data-state="closed"
      >
        <button
          class="country-navigation-trigger"
          type="button"
          aria-label="Open section navigation"
          aria-controls="country-navigation-panel"
          aria-expanded="false"
        >
          <img
            src="../assets/components/country-navigation/drawer-open.svg"
            alt=""
            width="63"
            height="30"
            draggable="false"
          >
        </button>

        <div
          class="country-navigation-panel"
          id="country-navigation-panel"
          aria-hidden="true"
          inert
        >
          <img
            class="country-navigation-panel-background"
            src="../assets/components/country-navigation/drawer.svg"
            alt=""
            width="299"
            height="1084"
            draggable="false"
          >

          <div class="country-navigation-content">
            <button
              class="country-navigation-close"
              type="button"
              aria-label="Close section navigation"
            >
              <img
                src="../assets/components/country-navigation/icon-xmark-drawer.svg"
                alt=""
                width="30"
                height="30"
                draggable="false"
              >
            </button>

            <nav
              class="country-navigation"
              data-country-navigation
              data-config="../data/components/country-navigation.json"
              aria-label="On this country page"
            ></nav>
          </div>
        </div>
      </aside>
    </div>


  </body>
