<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{seoDescription}}" />
    <title>{{seoTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/logo-favicon.svg" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/typography.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/components/header.css" />
    <link rel="stylesheet" href="/styles/pages/country-detail.css" />
    <script type="module" src="/scripts/header.js"></script>
  </head>
  <body>
    <a class="country-detail-skip" href="#main-content">Skip to content</a>
    <header class="header">
      <a class="logo" href="/" aria-label="Pareto Travel home">
        <img src="/assets/icons/logo.svg" alt="" />
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation menu">
        <img src="/assets/icons/icon-menu.svg" alt="" />
      </button>
      <ul class="nav" id="site-navigation">
        <li class="site-nav"><button type="button" data-places-trigger aria-haspopup="dialog" aria-expanded="false">PLACES</button></li>
        <li class="site-nav"><a href="/countries/months">MONTHS</a></li>
        <li class="site-nav" data-mobile-primary-nav><a href="/about">ABOUT</a></li>
      </ul>
    </header>
    <main class="country-detail" id="main-content">
      <a class="country-detail__back" href="{{countryHref}}" aria-label="Back to {{countryName}}">
        <img class="country-detail__back-icon" src="/assets/icons/icon-back.svg" alt="" width="240" height="60" />
      </a>
      <h1 class="country-sub-heading">{{detailTitle}}</h1>
      <div class="country-detail__body">
        {{detailContent}}
      </div>
      <a class="country-detail__back" href="{{countryHref}}" aria-label="Back to {{countryName}}">
        <img class="country-detail__back-icon" src="/assets/icons/icon-back.svg" alt="" width="240" height="60" />
      </a>
    </main>
  </body>
</html>
